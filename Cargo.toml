[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
files = { path = "crates/files" }
pictures = { path = "crates/pictures" }
rules = { path = "crates/rules" }
services = { path = "crates/services" }
wire = { path = "crates/wire" }
flate2 = "1"
httparse = "1"
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.7"
png = "0.18"
ring = "0.17"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
panic = "unwind"
strip = "symbols"
